apply plugin: 'com.android.library'

android {
    namespace 'com.necer'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    compileSdk 34
    defaultConfig {
        minSdk 15
        targetSdk 34
        versionCode 1
        versionName "5.0.1"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.0.0'
    api 'joda-time:joda-time:2.10.1'
}





